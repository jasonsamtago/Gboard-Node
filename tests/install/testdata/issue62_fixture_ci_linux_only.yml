# 官方 #62 反例：CI 正式矩陣只有 linux，沒有 freebsd artifact（測必須紅）
jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - run: make build-linux
  release:
    steps:
      - name: Release
        with:
          files: |
            dist/gboard-node-linux-amd64
            dist/gboard-node-linux-arm64
            dist/gbctl-linux-amd64
            dist/gbctl-linux-arm64
