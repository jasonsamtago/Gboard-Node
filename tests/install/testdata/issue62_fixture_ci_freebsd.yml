# 官方 #62 正例：CI 正式矩陣含 goos: freebsd，Release 上傳 freebsd artifact
jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: freebsd
            goarch: amd64
    steps:
      - run: make build-freebsd
  release:
    steps:
      - name: Release
        with:
          files: |
            dist/gboard-node-linux-amd64
            dist/gboard-node-freebsd-amd64
            dist/gbctl-linux-amd64
            dist/gbctl-freebsd-amd64
